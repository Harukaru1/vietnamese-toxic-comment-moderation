[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toxic-moderation"
version = "0.1.0"
description = "Vietnamese toxic comment moderation (clean / offensive / hate)"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pandas>=2.0", "scikit-learn>=1.4", "joblib>=1.3", "emoji>=2.8", "requests>=2.31"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
toxic_moderation = ["*.json"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
