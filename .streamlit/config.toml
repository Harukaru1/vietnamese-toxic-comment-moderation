[theme]
base = "light"
primaryColor = "#4f46e5"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f6f7fb"
textColor = "#1f2937"
borderColor = "#e5e7eb"
baseRadius = "0.75rem"
font = "'Be Vietnam Pro':https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"

[theme.sidebar]
backgroundColor = "#f6f7fb"

[server]
maxUploadSize = 2           # MB; the CSV tab reads at most 200 rows
enableXsrfProtection = true

[client]
showErrorDetails = "none"   # never show tracebacks to visitors
toolbarMode = "viewer"

[browser]
gatherUsageStats = false
