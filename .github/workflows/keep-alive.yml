name: Keep demo awake

# Streamlit Community Cloud puts the demo to sleep when nobody visits it; this visits it every 6 hours.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python scripts/wake_app.py
