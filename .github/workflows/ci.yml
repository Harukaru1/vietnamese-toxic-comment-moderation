name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # Lightweight deps only: the API tests use a fake predictor, so torch is not needed.
      - run: pip install pandas scikit-learn joblib emoji requests pytest httpx fastapi gradio
      - run: pip install --no-deps -e .
      - run: pytest -q
